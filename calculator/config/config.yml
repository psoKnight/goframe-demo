# 正式环境配置：使用正式 Etcd 集群进行服务注册发现。
grpc:
  name: "calculator"                       # 服务注册名；多实例必须保持一致。
  address: ":50053"                        # gRPC 业务监听地址。
  logStdout: true                          # 是否将 gRPC 日志输出到标准输出。
  errorStack: true                         # 错误日志是否附带堆栈。
  errorLogEnabled: false                   # 是否写入错误日志文件。
  accessLogEnabled: false                  # 是否记录每次 gRPC 调用。

healthserver:
  address: ":50054"                        # HTTP 健康检查端口。

registry:
  etcd:                                    # 正式共享注册中心。
    address: "etcd.example.internal:2379"  # 发布前替换为实际 Etcd 集群地址。
    keepaliveTTL: "10s"                    # 实例 Lease 保活周期。
    dialTimeout: "5s"                      # 连接 Etcd 的超时时间。

resilience:
  grpcRateLimit:                           # 每个服务副本、每个 RPC 方法独立限流。
    enabled: true                          # 是否启用 gRPC 服务端限流。
    rate: 200                              # 每秒补充的令牌数，即持续 QPS。
    burst: 400                             # 允许的瞬时突发请求数。
    keyTTL: "10m"                          # 空闲限流 Key 的缓存保留时间。
