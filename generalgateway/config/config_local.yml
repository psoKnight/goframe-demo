# 本地开发配置：使用 GoFrame 文件注册中心，不依赖 Etcd。
server:
  name: "generalgateway"          # HTTP 服务及注册中心实例名。
  address: ":8080"                # HTTP API 监听地址。
  serverAgent: "GoFrame v2"       # HTTP Server 响应头标识。
  dumpRouterMap: false            # 启动时是否打印完整路由表。
  openapiPath: "/api.json"        # OpenAPI 文档地址。
  swaggerPath: "/swagger"         # Swagger UI 地址。

rpcclient:
  greeterService: "greeter"       # 使用注册中心发现 Greeter，服务名与地址二选一。
  greeterAddress: ""              # Greeter 直连地址；服务名存在时保持为空。
  calculatorService: "calculator" # 使用注册中心发现 Calculator，服务名与地址二选一。
  calculatorAddress: ""           # Calculator 直连地址；服务名存在时保持为空。

resilience:
  httpRateLimit:                  # HTTP 请求限流，维度为 IP + Method + Path。
    enabled: true                 # 是否启用 Gateway HTTP 限流。
    rate: 100                     # 每个限流 Key 每秒补充的令牌数。
    burst: 200                    # 每个限流 Key 允许的瞬时突发请求数。
    keyTTL: "10m"                 # 空闲限流 Key 的缓存保留时间。
  circuitBreaker:                 # Gateway 为每个下游服务维护独立熔断器。
    greeter:                      # Greeter 下游熔断配置。
      enabled: true               # 是否启用 Greeter 熔断器。
      failureThreshold: 5         # 连续系统失败多少次后打开熔断器。
      interval: "30s"             # Closed 状态下的失败统计窗口。
      timeout: "15s"              # Open 状态持续时间，到期后进入 Half-Open。
      halfOpenMaxRequests: 1      # Half-Open 状态允许的探测请求数。
    calculator:                   # Calculator 下游熔断配置。
      enabled: true               # 是否启用 Calculator 熔断器。
      failureThreshold: 5         # 连续系统失败多少次后打开熔断器。
      interval: "30s"             # Closed 状态下的失败统计窗口。
      timeout: "15s"              # Open 状态持续时间，到期后进入 Half-Open。
      halfOpenMaxRequests: 1      # Half-Open 状态允许的探测请求数。
